version: "1.0"
name: "test-flow"
description: "A test flow"
config:
  default_provider: "openai"
  default_model: "gpt-4"
nodes:
  - id: "node1"
    type: "llm"
    inputs:
      - name: "user_input"
        from: "input"
    prompt: "Echo: {{.user_input}}"
    outputs:
      - name: "response"
        to: "output"
